<div class="w-full rounded-lg border border-base-300 p-3 bg-base-200">
  <h2 class="font-semibold mb-2">Datos de transferencia</h2>
  <p>Transferí a:</p>
  <p><span class="font-semibold">Alias:</span> {{ bankData.alias }}</p>
  <p><span class="font-semibold">CBU:</span> {{ bankData.cbu }}</p>
  <p><span class="font-semibold">Titular:</span> {{ bankData.holder }}</p>
  <p><span class="font-semibold">Banco:</span> {{ bankData.bank }}</p>
</div>

<a
  [href]="whatsappUrl()"
  target="_blank"
  rel="noopener noreferrer"
  class="btn btn-success w-full sm:w-auto"
>
  Enviar pedido por WhatsApp
</a>
