<div class="flex flex-col items-center justify-center h-full">
  <form [formGroup]="profileForm" (ngSubmit)="save()" class="fieldset bg-base-200 border-base-300 rounded-box w-xs border p-4">
    <legend class="text-center">Bienvenido</legend>
    <div class="avatar flex flex-col items-center justify-center">
             <app-image-field
              label="Foto de perfil"
              [imageUrl]="resolvedAvatarUrl()"
              [autoUploadOnSelect]="true"
              [isUploading]="isUploadingImage()"
              [isDeleting]="isDeletingImage()"
              [errorMessage]="imageError()"
              [maxImages]="3"
              (fileSelected)="onImageFileSelected($event)"
              (uploadRequested)="onUploadImage()"
              (deleteRequested)="onDeleteImage()"
            />
    </div>

    <label for="name" class="label">Nombre</label>
    <input id="name" formControlName="name" type="text" class="input" placeholder="Nombre" />
    @if (nameError(); as message) {
    <p class="text-error text-sm" role="alert">{{ message }}</p>
    }

    <label for="lastName" class="label">Apellido</label>
    <input id="lastName" formControlName="lastName" type="text" class="input" placeholder="Apellido" />
    @if (lastNameError(); as message) {
    <p class="text-error text-sm" role="alert">{{ message }}</p>
    }

    <!-- <label for="email" class="label">Email</label>
  <input id="email" formControlName="email" type="email" class="input" placeholder="Email" /> -->

    @if (enableEdit()) {
    <button type="submit" [disabled]="!canSave()" class="btn btn-neutral mt-4">{{ isSaving() ? 'Guardando…' : 'Guardar' }}</button>
    <button type="button" [disabled]="isSaving()" (click)="cancel()" class="btn btn-ghost mt-2">Cancelar</button>
    }@else {
    <button type="button" (click)="edit()" class="btn btn-neutral mt-4">Editar</button>
    }

  </form>
</div>
