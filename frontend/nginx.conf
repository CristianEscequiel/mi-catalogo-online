server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # /api/ lo enruta el nginx del borde (web-stack) directo al backend; este contenedor
  # solo sirve estáticos y no depende de que el backend exista para arrancar.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
